name: tom_build_cli
description: CLI implementation for the Tom build system.
version: 1.0.2
publish_to: none

environment:
  sdk: ^3.10.4

dependencies:
  glob: ^2.1.2
  path: ^1.9.0
  yaml: ^3.1.2
  pub_semver: ^2.2.0
  
  # Tom packages
  tom_build:
    path: ../tom_build
  tom_d4rt: ">=1.11.0"
  tom_core_kernel:
    path: ../../core/tom_core_kernel
  tom_core_server:
    path: ../../core/tom_core_server
  tom_dist_ledger:
    path: ../../distributed/tom_dist_ledger
  tom_process_monitor:
    path: ../../distributed/tom_process_monitor
  
  # D4rt CLI base (build CLI extends D4rt CLI)
  # >=1.1.6 carries the duplicate-export fix required for AOT compilation.
  tom_d4rt_dcli: ">=1.1.6"
  tom_vscode_scripting_api: ">=1.1.0"
  # Hosted, lower bound only. The tom_d4rt_generator floor (analyzer ^14.5)
  # already rules out the analyzer-10 line (1.8.x), so this resolves 1.9+.
  tom_reflection_generator: ">=1.8.2"

dev_dependencies:
  build_runner: ^2.4.6
  lints: ^6.0.0
  test: ^1.25.6
  # Floor 1.58.0: the first release on tom_analyzer_shared 0.13.0, whose
  # summary cache neither keeps a truncated bundle nor deletes one a concurrent
  # run links against (both silently dropped types from generated bridges).
  # test/bridges_fresh_test.dart also needs `checkBridgeFreshness` (1.17.0+).
  tom_d4rt_generator: ">=1.58.0"
  tom_build_kit: ">=1.12.0"

