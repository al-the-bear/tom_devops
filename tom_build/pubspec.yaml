name: tom_build
description: Build tools and workspace analyzer for the Tom framework.
version: 1.0.9
publish_to: none

environment:
  sdk: ^3.10.4

executables:
  workspace_analyzer: workspace_analyzer

dependencies:
  # No direct analyzer use in lib/ or bin/ (verified: zero `package:analyzer`
  # imports). The constraint was dead and conflicted with the analyzer-10 path
  # deps (tom_d4rt_generator, tom_reflection_generator). Dropped so analyzer
  # resolves transitively at ^10. See analyzer_10_migration_plan Phase 5.
  build: ^4.0.3
  dart_style: ^3.0.0
  logging: ^1.3.0
  path: ^1.9.0
  pub_semver: ^2.2.0
  tom_d4rt: ">=1.11.0"
  tom_reflection: ">=1.0.1"
  tom_core_kernel:
    path: ../../core/tom_core_kernel
  tom_core_server:
    path: ../../core/tom_core_server
  tom_dist_ledger:
    path: ../../distributed/tom_dist_ledger
  tom_process_monitor:
    path: ../../distributed/tom_process_monitor
  yaml: ^3.1.2

dev_dependencies:
  # The workspace clone the suites that read the whole workspace run on.
  tom_test_support:
    path: ../../basics/tom_test_support
  lints: ^6.0.0
  test: ^1.25.6
  build_runner: ^2.10.4
  # Floor 1.58.0: the first release on tom_analyzer_shared 0.13.0, whose
  # summary cache neither keeps a truncated bundle nor deletes one a concurrent
  # run links against (both silently dropped types from generated bridges).
  tom_d4rt_generator: ">=1.58.0"
  # Hosted, lower bound only. The tom_d4rt_generator floor (analyzer ^14.5)
  # already rules out the analyzer-10 line (1.8.x), so this resolves 1.9+.
  tom_reflection_generator: ">=1.8.2"
  json_schema: ^5.2.2
